        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null, errorInfo: null };
            }
            componentDidCatch(error, errorInfo) {
                this.setState({ hasError: true, error, errorInfo });
                console.error('=== ERROR BOUNDARY CAUGHT ===');
                console.error('Error:', error.message);
                console.error('Component stack:', errorInfo.componentStack);
            }
            render() {
                if (this.state.hasError) {
                    return React.createElement('div', {
                        style: { padding: '20px', background: '#fee', border: '2px solid red', margin: '20px', borderRadius: '8px' }
                    }, [
                        React.createElement('h2', { key: 'h' }, '❌ Error de Render'),
                        React.createElement('pre', { key: 'e', style: { fontSize: '12px', overflow: 'auto' } }, 
                            String(this.state.error) + '\n\nComponent Stack:\n' + (this.state.errorInfo && this.state.errorInfo.componentStack || '')
                        )
                    ]);
                }
                return this.props.children;
            }
        }

                const isPeyotePattern = (result.pattern_type === 'peyote');

                const cellW = mainCanvas.width / beadsWidth;

                    ? mainCanvas.height / (beadsHeight + 0.5)
                    : mainCanvas.height / beadsHeight;

                const fontSize = Math.max(8, Math.min(cellW, cellH) * 0.4);
                ctx.font = `bold ${fontSize}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                const getContrastColor = (rgb) => {
                    const brightness = (rgb[0] * 299 + rgb[1] * 587 + rgb[2] * 114) / 1000;
                    return brightness > 128 ? 'black' : 'white';
                };

                const colorMap = {};
                if (result.colors && result.colors.colors) {
                    result.colors.colors.forEach(c => {
                        // Index by both 'code' and 'miyuki' to handle DB0879 vs 0879
                        if (c.code) colorMap[c.code] = c.rgb;
                        if (c.miyuki) colorMap[c.miyuki] = c.rgb;
                        // Also index without DB prefix
                        if (c.miyuki) colorMap[c.miyuki.replace('DB', '')] = c.rgb;
                    });
                }

                if (isPeyotePattern) {
                    // PEYOTE: rowGuide tiene filas enteras y semifilas (.5)
                    const fullRows = result.rowGuide.rows.filter(r => !String(r.row_label || r.row).includes('.'));
                    const halfRows = result.rowGuide.rows.filter(r =>  String(r.row_label || r.row).includes('.'));

                    // Highlight fila/semifila activa
                    fullRows.forEach((row, rowIndex) => {
                        if (rowIndex * 2 === activeRow) {
                            ctx.strokeStyle = 'rgba(255, 50, 50, 0.9)';
                            ctx.lineWidth = 2;
                            ctx.strokeRect(1, rowIndex * cellH + 1, canvas.width - 2, cellH - 2);
                        }
                        if (rowIndex * 2 + 1 === activeRow) {
                            ctx.strokeStyle = 'rgba(255, 50, 50, 0.9)';
                            ctx.lineWidth = 2;
                            ctx.strokeRect(1, rowIndex * cellH + cellH / 2 + 1, canvas.width - 2, cellH - 2);
                        }
                    });

                    // Filas enteras (columnas pares x%2==0): bead 0→col 0, bead 1→col 2...

                        let beadNum = 0;
                        let segCounter = 1;
                        let lastCode = null;
                        row.sequence.forEach(segment => {
                            if (segment.code !== lastCode) { segCounter = 1; lastCode = segment.code; }
                            const rgb = colorMap[segment.code] || [128, 128, 128];
                            const textColor = getContrastColor(rgb);
                            for (let i = 0; i < segment.count; i++) {
                                const canvasX = (beadNum * 2 + 0.5) * cellW;
                                const canvasY = (rowIndex + 0.5) * cellH;
                                ctx.fillStyle = textColor;
                                ctx.fillText(String(segCounter), canvasX, canvasY);
                                segCounter++;
                                beadNum++;
                            }
                        });
                    });

                    // Semifilas (columnas impares x%2==1): bead 0→col 1, bead 1→col 3...

                        const halfLabel = parseFloat(halfRow.row_label || halfRow.row);
                        const rowY = Math.floor(halfLabel) - 1;
                        let beadNum = 0;
                        let segCounter = 1;
                        let lastCode = null;
                        halfRow.sequence.forEach(segment => {
                            if (segment.code !== lastCode) { segCounter = 1; lastCode = segment.code; }
                            const rgb = colorMap[segment.code] || [128, 128, 128];
                            const textColor = getContrastColor(rgb);
                            for (let i = 0; i < segment.count; i++) {

                    const totalSteps = isPeyote

                        const canvas = numbersCanvasRef.current;

                        const cellH = canvas.height / (beadsH + 0.5);
                        // rowStep 0,1 = fila 1 y 1.5, rowStep 2,3 = fila 2 y 2.5, etc.

                        const scrollY = realRow * cellH * (canvas.clientHeight / canvas.height);
                        canvas.parentElement?.scrollTo({ top: scrollY - canvas.clientHeight / 3, behavior: 'smooth' });
                    };

                    if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        setActiveRow(prev => {
                            const next = Math.min(prev + 1, totalSteps);
                            scrollToRow(next);
                            return next;
                        });
                    } else if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        setActiveRow(prev => {
                            const next = Math.max(prev - 1, 0);
                            scrollToRow(next);

                        });

                if (!canvasRef.current || lastViewedTab === 'coords') return;
                
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                
                const beadsWidth = result.pattern.width;
                const beadsHeight = result.pattern.height;
                const isPeyote = result.pattern_type === 'peyote';
                
                let beadX, beadY;
                
                if (isPeyote) {
                    const pixelWidth = canvas.width / beadsWidth;
                    const pixelHeight = canvas.height / (beadsHeight + 0.5);
                    
                    const clickX = e.clientX - rect.left;
                    const clickY = e.clientY - rect.top;
                    
                    const canvasClickX = (clickX / rect.width) * canvas.width;
                    const canvasClickY = (clickY / rect.height) * canvas.height;
                    
                    beadX = Math.floor(canvasClickX / pixelWidth);
                    const offsetY = (beadX % 2 === 1) ? (pixelHeight / 2) : 0;
                    beadY = Math.floor((canvasClickY - offsetY) / pixelHeight);
                } else {
                    beadX = Math.floor((e.clientX - rect.left) / rect.width * beadsWidth);
                    beadY = Math.floor((e.clientY - rect.top) / rect.height * beadsHeight);
                }
                
                if (beadX < 0 || beadX >= beadsWidth || beadY < 0 || beadY >= beadsHeight) {
                    return;
                }
                
                // Obtener color del pixel
                let pixelX, pixelY;
                
                if (isPeyote) {
                    const pixelWidth = canvas.width / beadsWidth;
                    const pixelHeight = canvas.height / (beadsHeight + 0.5);
                    const offsetY = (beadX % 2 === 1) ? (pixelHeight / 2) : 0;
                    pixelX = Math.floor(beadX * pixelWidth + pixelWidth / 2);
                    pixelY = Math.floor(beadY * pixelHeight + offsetY + pixelHeight / 2);
                } else {
                    const pixelWidth = canvas.width / beadsWidth;
                    const pixelHeight = canvas.height / beadsHeight;
                    pixelX = Math.floor(beadX * pixelWidth + pixelWidth / 2);

                            // Color de texto según luminosidad del fondo

            // ========== GUARDAR Y CARGAR PATRÓN ==========

            const loadPattern = async (event) => {

                const reader = new FileReader();
                reader.onload = async (e) => {

                        // Validar que es un archivo de patrón válido
                        if (!patternData.version || !patternData.pattern || !patternData.images) {
                            alert('⚠️ Archivo inválido: no es un patrón de Miyuki Pattern Generator');

                        // Si es peyote y el rowGuide no tiene filas .5,
                        // agregar row_label a las filas existentes (JSON viejo)

                        setResult({

                        });

                        setEditedPattern(patternData.editedPattern || patternData.images.grid);
                        setIsBlankCanvas(patternData.isBlankCanvas || false);

                        // Restaurar configuraciones
                        if (patternData.settings) {

                            let restoredDimMode = s.dimensionMode || null;

                        setPatternVersion(v => v + 1);

                        alert(`✅ Patrón cargado exitosamente (${patternTypeText})\nPuedes continuar editando o descargar las imágenes`);  // ← MODIFICADA

                    } catch (err) {

                reader.readAsText(file);

            const startEditing = () => {
                setEditMode(true);
                setActiveTab('editor');
                // Initialize canvas with current pattern
                setTimeout(() => {
                    if (canvasRef.current) {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = canvasRef.current;
                            const ctx = canvas.getContext('2d');
                            canvas.width = img.width;
                            canvas.height = img.height;
                            ctx.imageSmoothingEnabled = false;
                            ctx.drawImage(img, 0, 0);
                        };
                        img.src = editedPattern || result.images.basic;
                    }
                }, 100);
            };

            // Lógica de pintar un bead — usada por click y por drag
            const paintBead = (e) => {
                const colorToUse = dragColorRef.current || selectedColor;
if (!colorToUse || !canvasRef.current) return;

                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                
                const beadsWidth = result.pattern.width;
                const beadsHeight = result.pattern.height;
                const isPeyote = result.pattern_type === 'peyote';
                
                let beadX, beadY;
                
                if (isPeyote) {
                    const pixelWidth = canvas.width / beadsWidth;
                    const pixelHeight = canvas.height / (beadsHeight + 0.5);
                    const canvasClickX = ((e.clientX - rect.left) / rect.width) * canvas.width;
                    const canvasClickY = ((e.clientY - rect.top) / rect.height) * canvas.height;
                    beadX = Math.floor(canvasClickX / pixelWidth);
                    const offsetY = (beadX % 2 === 1) ? (pixelHeight / 2) : 0;
                    beadY = Math.floor((canvasClickY - offsetY) / pixelHeight);
                } else {
                    beadX = Math.floor((e.clientX - rect.left) / rect.width * beadsWidth);
                    beadY = Math.floor((e.clientY - rect.top) / rect.height * beadsHeight);
                }
                
                if (beadX < 0 || beadX >= beadsWidth || beadY < 0 || beadY >= beadsHeight) return;
                
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                
                if (isPeyote) {
                    const pixelWidth = canvas.width / beadsWidth;
                    const pixelHeight = canvas.height / (beadsHeight + 0.5);
                    const offsetY = (beadX % 2 === 1) ? (pixelHeight / 2) : 0;
                    ctx.fillStyle = `rgb(${colorToUse.rgb[0]},${colorToUse.rgb[1]},${colorToUse.rgb[2]})`;
                    ctx.fillRect(Math.floor(beadX * pixelWidth), Math.floor(beadY * pixelHeight + offsetY), Math.ceil(pixelWidth), Math.ceil(pixelHeight));
                } else {
                    const pixelWidth = canvas.width / beadsWidth;
                    const pixelHeight = canvas.height / beadsHeight;
                    ctx.fillStyle = `rgb(${colorToUse.rgb[0]},${colorToUse.rgb[1]},${colorToUse.rgb[2]})`;
                    ctx.fillRect(Math.floor(beadX * pixelWidth), Math.floor(beadY * pixelHeight), Math.ceil(pixelWidth), Math.ceil(pixelHeight));
                }
                
                setHasUnsavedChanges(true);
                setUsedColorsVersion(v => v + 1);
                setEditedPattern(canvas.toDataURL());
            };

            const handleCanvasClick = (e) => {
                if (!selectedColor || !canvasRef.current) return;

                // Guardar para deshacer
                setUndoStack(prev => [...prev.slice(-2), canvasRef.current.toDataURL()]);

                paintBead(e);
            };

            const handleMouseDown = (e) => {
                if (toolMode === 'paint') {
                    const canvas = canvasRef.current;
                    if (!canvas) return;
                    
                    // Leer el color del pixel clickeado
                    const rect = canvas.getBoundingClientRect();
                    const beadsWidth = result.pattern.width;
                    const beadsHeight = result.pattern.height;
                    const beadX = Math.floor((e.clientX - rect.left) / rect.width * beadsWidth);
                    const beadY = Math.floor((e.clientY - rect.top) / rect.height * beadsHeight);
                    
                    if (beadX >= 0 && beadX < beadsWidth && beadY >= 0 && beadY < beadsHeight) {
                        const ctx = canvas.getContext('2d', { willReadFrequently: true });
                        const pixelWidth = canvas.width / beadsWidth;
                        const pixelHeight = canvas.height / beadsHeight;
                        const pixelData = ctx.getImageData(
                            Math.floor(beadX * pixelWidth + pixelWidth / 2),
                            Math.floor(beadY * pixelHeight + pixelHeight / 2),
                            1, 1
                        ).data;
                        const rgb = [pixelData[0], pixelData[1], pixelData[2]];
                        
                        // Guardar color del pixel para si hay drag — NO cambiar selectedColor todavía
                        const pickedColor = findClosestColor(rgb);
                        dragColorRef.current = pickedColor || selectedColor;
                    }
                    
                    hasDraggedRef.current = false;
                    mouseDownEventRef.current = e;
                    setIsPainting(true);
                    setUndoStack(prev => [...prev.slice(-2), canvas.toDataURL()]);
                    return;
                }
                if (toolMode !== 'select' || !canvasRef.current) return;
                
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const beadsWidth = result.pattern.width;
                const beadsHeight = result.pattern.height;
                
                const beadX = Math.floor((e.clientX - rect.left) / rect.width * beadsWidth);
                const beadY = Math.floor((e.clientY - rect.top) / rect.height * beadsHeight);
                
                setIsSelecting(true);
                setSelection({
                    startX: beadX,
                    startY: beadY,
                    endX: beadX,
                    endY: beadY
                });
            };

            const handleMouseMove = (e) => {
                if (!canvasRef.current || !result) return;
                
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const beadsWidth = result.pattern.width;
                const beadsHeight = result.pattern.height;
                
                const beadX = Math.floor((e.clientX - rect.left) / rect.width * beadsWidth);
                const beadY = Math.floor((e.clientY - rect.top) / rect.height * beadsHeight);
                
                // Actualizar coordenadas del mouse siempre (para mostrar en UI) y el color del pixel
                if (beadX >= 0 && beadX < beadsWidth && beadY >= 0 && beadY < beadsHeight) {
                    // Obtener color del pixel en la posición correcta
                    const ctx = canvas.getContext('2d');
                    const pixelWidth = canvas.width / beadsWidth;
                    const pixelHeight = canvas.height / beadsHeight;
                    const pixelData = ctx.getImageData(
                        Math.floor(beadX * pixelWidth + pixelWidth / 2),
                        Math.floor(beadY * pixelHeight + pixelHeight / 2),
                        1, 1
                    ).data;
                    
                    const rgb = [pixelData[0], pixelData[1], pixelData[2]];
                    
                    setMouseCoords({ 
                        x: beadX + 1, 
                        y: beadY + 1,
                        rgb: rgb
                    });
                }
                
                // Pintar mientras se arrastra (drag to paint)
                if (isPainting && toolMode === 'paint') {
                    hasDraggedRef.current = true;
                    paintBead(e);
                }
                
                // Continuar con lógica de selección si está activa
                if (isSelecting && toolMode === 'select') {
                    setSelection(prev => ({
                        ...prev,
                        endX: beadX,
                        endY: beadY
                    }));
                }
            };

            const handleMouseLeave = () => {
                setMouseCoords(null);
                if (isPainting) {
                    setIsPainting(false);
                    dragColorRef.current = null;
                    hasDraggedRef.current = false;
                }
            };

            // Normaliza colores del JSON guardado para asegurar que name sea siempre string
            const normalizeColors = (colors) => {
                if (!colors) return colors;
                return {
                    ...colors,
                    colors: (colors.colors || []).map(c => ({
                        ...c,
                        name: typeof c.name === 'object' 
                            ? (c.name?.[i18n.currentLanguage] || c.name?.es || c.name_es || Object.values(c.name)[0] || '')
                            : (c.name || c.name_es || c.name_en || ''),
                        miyuki: typeof c.miyuki === 'object'
                            ? (c.miyuki?.code || c.miyuki_code || String(c.miyuki) || '')
                            : (c.miyuki || c.miyuki_code || '')
                    }))
                };
            };


            // Garantiza que un valor sea siempre un string renderizable
            const safeStr = (val) => {
                if (val === null || val === undefined) return '';
                if (typeof val === 'string') return val;
                if (typeof val === 'object') {
                    const lang = i18n.currentLanguage || 'es';
                    return val[lang] || val.es || val.en || Object.values(val).find(v => typeof v === 'string') || '';
                }
                return String(val);
            };

            const findClosestColor = (rgb) => {
                if (!rgb) return null;
                
                const palette = fullPalette || result?.colors?.colors || [];
                if (palette.length === 0) return null;
                
                let closest = palette[0];
                let minDistance = Infinity;
                
                palette.forEach(color => {
                    const distance = Math.sqrt(
                        Math.pow(rgb[0] - color.rgb[0], 2) +
                        Math.pow(rgb[1] - color.rgb[1], 2) +
                        Math.pow(rgb[2] - color.rgb[2], 2)
                    );
                    
                    if (distance < minDistance) {
                        minDistance = distance;
                        closest = color;
                    }
                });
                
                return closest;
            };

            const handleUndo = () => {
                if (undoStack.length === 0 || !canvasRef.current) return;
                
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const img = new Image();
                const prevState = undoStack[undoStack.length - 1];
                
                img.onload = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                    setUndoStack(prev => prev.slice(0, -1));
                };
                
                img.src = prevState;
            };

            const handleMouseUp = () => {
                if (isPainting) {
                    const wasDragging = hasDraggedRef.current;
                    const savedEvent = mouseDownEventRef.current;
                    const savedColor = selectedColor;
                    
                    setIsPainting(false);
                    dragColorRef.current = null;
                    hasDraggedRef.current = false;

                    // Click simple sin drag → pintar con delay para que doble click pueda cancelar
                    if (!wasDragging && savedColor && savedEvent) {
                        const savedCanvas = canvasRef.current;
                        console.log('🖱️ mouseUp: programando paint en 250ms', { savedColor: savedColor?.code, hasCanvas: !!savedCanvas });
                        paintTimeoutRef.current = setTimeout(() => {
                            console.log('⏱️ timeout ejecutado, isDoubleClick:', isDoubleClickRef.current);
                            if (!isDoubleClickRef.current && savedCanvas) {
                                const rect = savedCanvas.getBoundingClientRect();
                                const beadsWidth = result.pattern.width;
                                const beadsHeight = result.pattern.height;
                                const isPeyote = result.pattern_type === 'peyote';
                                let beadX, beadY;
                                if (isPeyote) {
                                    const pixelWidth = savedCanvas.width / beadsWidth;
                                    const pixelHeight = savedCanvas.height / (beadsHeight + 0.5);
                                    const canvasClickX = ((savedEvent.clientX - rect.left) / rect.width) * savedCanvas.width;

                const pixelWidth = canvas.width / beadsWidth;

                // Calcular bead destino donde se hace click
                const canvasClickX = ((e.clientX - rect.left) / rect.width) * canvas.width;
                const canvasClickY = ((e.clientY - rect.top) / rect.height) * canvas.height;
                const destBeadX = Math.floor(canvasClickX / pixelWidth);
                const destOffsetY = isPeyote ? (destBeadX % 2 === 1 ? pixelHeight / 2 : 0) : 0;
                const destBeadY = Math.floor((canvasClickY - destOffsetY) / pixelHeight);

                if (!beadColors) {
                    const x = Math.floor(destBeadX * pixelWidth);
                    const y = Math.floor(destBeadY * pixelHeight + destOffsetY);
                    ctx.putImageData(clipboard.imageData, x, y);
                } else {
                    for (let dy = 0; dy < height; dy++) {
                        for (let dx = 0; dx < width; dx++) {
                            const bx = destBeadX + dx;
                            const by = destBeadY + dy;
                            if (bx < 0 || bx >= beadsWidth || by < 0 || by >= beadsHeight) continue;
                            const [r, g, b, a] = beadColors[dy][dx];
