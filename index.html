    <script type="text/babel">
        const { useState, useRef, useEffect, useMemo, useCallback } = React;

        // API Configuration - Auto-detect environment
        const API_URL = window.location.hostname === 'localhost' 
            ? 'http://localhost:5000/api'
            : 'https://miyuki-backend.onrender.com/api';

        function App() {
            const [image, setImage] = useState(null);
            const [width, setWidth] = useState(5.0);
            const [height, setHeight] = useState(5.0);            
            const [beadSize, setBeadSize] = useState(1.5);
            const [beadSizeVersion, setBeadSizeVersion] = React.useState(0);
            const [dimensionMode, setDimensionMode] = useState('cm'); // 'cm' o 'beads'
            const [colorCount, setColorCount] = useState(10);
            const [colorMode, setColorMode] = useState('miyuki'); // 'miyuki' or 'rgb'
            const [creationMode, setCreationMode] = useState('photo'); // 'photo' o 'scratch'
            const [blankPattern, setBlankPattern] = useState(null);
            const [isBlankCanvas, setIsBlankCanvas] = useState(false);
            const [fullPalette, setFullPalette] = useState(null);
            const [patternType, setPatternType] = useState('grid'); // 'grid' o 'peyote'
            const [imageDimensions, setImageDimensions] = useState(null);
            const coordsTextCanvasRef = React.useRef(null);
            const [coordsTextReady, setCoordsTextReady] = React.useState(false);
            const [showUpgradeModal, setShowUpgradeModal] = React.useState(false);
            
            // Color adjustment controls
            const [saturation, setSaturation] = useState(1.2);
            const [brightness, setBrightness] = useState(1.0);
            const [contrast, setContrast] = useState(1.1);
            const [sharpness, setSharpness] = useState(1.0);
            const [showAdvanced, setShowAdvanced] = useState(false);
            
            const [processing, setProcessing] = useState(false);
            const [result, setResult] = useState(null);
            const [activeTab, setActiveTab] = useState('grid');
            const [lastViewedTab, setLastViewedTab] = useState('grid'); // Para saber qué imagen cargar en el editor
            const [error, setError] = useState(null);
            const [apiConnected, setApiConnected] = useState(false);
            const [editMode, setEditMode] = useState(false);
            const [selectedColor, setSelectedColor] = useState(null);
            const [toolMode, setToolMode] = useState('paint'); // 'paint', 'select', 'paste'
            const [selection, setSelection] = useState(null); // {startX, startY, endX, endY}
            const [clipboard, setClipboard] = useState(null); // Área copiada
            const [isSelecting, setIsSelecting] = useState(false);
            const [editedPattern, setEditedPattern] = useState(null);
            const [showNumbers, setShowNumbers] = useState(false);  // ← AGREGAR
            const fileInputRef = useRef(null);
            const canvasRef = useRef(null);
            const [replaceFromColor, setReplaceFromColor] = useState(null);
            const [replaceToColor, setReplaceToColor] = useState(null);
            const [replaceSelectingMode, setReplaceSelectingMode] = useState(null); // 'from' o 'to'
            const [mouseCoords, setMouseCoords] = useState(null); // {x, y} coordenadas del píxel bajo el mouse
            const loadPatternInputRef = useRef(null);
            const [undoHistory, setUndoHistory] = useState(null); // Guardar estado anteriores para deshacer
            const [menuCollapsed, setMenuCollapsed] = useState(false);
            const [paletteTab, setPaletteTab] = useState('used'); // 'used' o 'all'
            const [usedColorsVersion, setUsedColorsVersion] = useState(0);
            const [selectedCategory, setSelectedCategory] = useState('all'); // 'all' o categoría específica
            const [searchText, setSearchText] = useState('');
            const [doubleClickModal, setDoubleClickModal] = useState(null); // {x, y, color, pixelX, pixelY}
            const [modalPaletteTab, setModalPaletteTab] = useState('used'); // 'used' o 'all'
            const [modalSearchText, setModalSearchText] = useState('');
            const [modalSelectedCategory, setModalSelectedCategory] = useState('all');
            const [clickTimeout, setClickTimeout] = useState(null);
            const [modalSelectedColor, setModalSelectedColor] = useState(null);
            const [cachedUsedColors, setCachedUsedColors] = useState([]);
            const [lastCacheVersion, setLastCacheVersion] = useState(-1);
            const [hasUnsavedChanges, setHasUnsavedChanges] = React.useState(false);
            const [user, setUser] = React.useState(null);
            const [userData, setUserData] = React.useState(null);
            const [showAuthModal, setShowAuthModal] = React.useState(false);
            const [galleryPatterns, setGalleryPatterns] = React.useState([]);
            const [isFromGallery, setIsFromGallery] = React.useState(false);
            const gridCanvasRef = React.useRef(null);
            const [showGridInView, setShowGridInView] = React.useState(true);
            const gridViewCanvasRef = React.useRef(null);
            const [gridViewReady, setGridViewReady] = React.useState(false);
            const gridCoordsCanvasRef = React.useRef(null);
            const [gridCoordsReady, setGridCoordsReady] = React.useState(false);
            const numbersCanvasRef = React.useRef(null);
            const [numbersReady, setNumbersReady] = React.useState(false);
            const [patternVersion, setPatternVersion] = React.useState(0);


            const CATEGORIES = {
                'all': { emoji: '🎨', name: 'Todos' },
                'rojos': { emoji: '🔴', name: 'Rojos' },
                'rosas': { emoji: '🩷', name: 'Rosas' },
                'naranjas': { emoji: '🟠', name: 'Naranjas' },
                'amarillos': { emoji: '🟡', name: 'Amarillos' },
                'verdes': { emoji: '🟢', name: 'Verdes' },
                'azules': { emoji: '🔵', name: 'Azules' },
                'morados': { emoji: '🟣', name: 'Morados' },
                'blancos': { emoji: '⚪', name: 'Blancos' },
                'grises': { emoji: '⚫', name: 'Grises' },
                'negros': { emoji: '⬛', name: 'Negros' },
                'metalicos': { emoji: '✨', name: 'Metálicos' }
            };            

            useEffect(() => {
                checkApiConnection();
                // Retry connection every 5 seconds if not connected
                const interval = setInterval(() => {
                    if (!apiConnected) {
                        checkApiConnection();
                    }
                }, 5000);
                return () => clearInterval(interval);
            }, [apiConnected]);

            useEffect(() => {
                // Limpiar cache cuando cambia el resultado
                setCachedUsedColors([]);
                setLastCacheVersion(-1);
            }, [result]);            

            // Draw edited pattern on canvas
            useEffect(() => {

                if (canvasRef.current && activeTab === 'editor' && result?.images) {
                    const canvas = canvasRef.current;
                    const ctx = canvas.getContext('2d');
                    const img = new Image();
                    
                    // Determinar qué imagen cargar basándose en lastViewedTab
                    let imageToLoad;
                    if (lastViewedTab === 'coords' && result.images.coordinates) {
                        imageToLoad = result.images.coordinates;
                        console.log('✅ useEffect: Cargando COORDENADAS');
                    } else {
                        imageToLoad = result.images.grid;
                        console.log('✅ useEffect: Cargando GRID');
                    }
                    
                    img.onload = () => {
                        console.log('✅ Image loaded, drawing on canvas');
                        console.log('📐 Image dimensions:', img.width, 'x', img.height);
                        console.log('📐 Canvas before resize:', canvas.width, 'x', canvas.height);
                        canvas.width = img.width;
                        canvas.height = img.height;
                        console.log('📐 Canvas after resize:', canvas.width, 'x', canvas.height);
                        ctx.imageSmoothingEnabled = false;
                        ctx.drawImage(img, 0, 0);
                        console.log('✅ Image drawn on canvas');

                        // Dibujar grid en el editor
                        const beadsWidth = result.pattern.width;
                        const beadsHeight = result.pattern.height;
                        const isPeyote = result.pattern_type === 'peyote';

                        
                        console.log('✅ Grid dibujado en editor');

                        // Invalidar cache para forzar recalcular
                        setUsedColorsVersion(v => v + 1);

                        // AGREGAR ESTOS LOGS:
                        console.log('🔍 Verificando auto-save:', {
                            isBlankCanvas,
                            editedPattern: !!editedPattern,
                            shouldAutoSave: isBlankCanvas && !editedPattern
                        });

                        // NUEVA CONDICIÓN: Solo si es blank canvas Y acabamos de entrar al editor
                        if (isBlankCanvas && activeTab === 'editor' && result) {
                            console.log('🔄 Auto-guardando blank canvas para limpiar colores...');
                            
                            // Solo auto-guardar UNA VEZ usando un flag
                            const hasAutoSaved = sessionStorage.getItem('blankCanvasAutoSaved');

                    for (const segment of rowGuide) {

                        const rgb = getColorRGB(colorCode, result);

                    const clickX = e.clientX - rect.left;

                    // Escalar al tamaño del canvas real
                    const canvasClickX = (clickX / rect.width) * canvas.width;
                    const canvasClickY = (clickY / rect.height) * canvas.height;
                    
                    // Determinar columna
                    beadX = Math.floor(canvasClickX / pixelWidth);
                    
                    // Determinar fila considerando offset
                    const offsetY = (beadX % 2 === 1) ? (pixelHeight / 2) : 0;
                    beadY = Math.floor((canvasClickY - offsetY) / pixelHeight);

                    // Cálculo para CUADRÍCULA (normal)

                const beadsHeight = result.pattern.height;
                
                const beadX = Math.floor((e.clientX - rect.left) / rect.width * beadsWidth);
                const beadY = Math.floor((e.clientY - rect.top) / rect.height * beadsHeight);
                
                setIsSelecting(true);
                setSelection({
                    startX: beadX,
                    startY: beadY,
                    endX: beadX,
                    endY: beadY
                });

                const rect = canvas.getBoundingClientRect();
                const beadsWidth = result.pattern.width;
                const beadsHeight = result.pattern.height;
                
                const beadX = Math.floor((e.clientX - rect.left) / rect.width * beadsWidth);
                const beadY = Math.floor((e.clientY - rect.top) / rect.height * beadsHeight);
                
                // Actualizar coordenadas del mouse siempre (para mostrar en UI) y el color del pixel
                if (beadX >= 0 && beadX < beadsWidth && beadY >= 0 && beadY < beadsHeight) {
                    // Obtener color del pixel en la posición correcta
                    const ctx = canvas.getContext('2d');
                    const pixelWidth = canvas.width / beadsWidth;
                    const pixelHeight = canvas.height / beadsHeight;
                    const pixelData = ctx.getImageData(
                        Math.floor(beadX * pixelWidth + pixelWidth / 2),
                        Math.floor(beadY * pixelHeight + pixelHeight / 2),
                        1, 1
                    ).data;
                    
                    const rgb = [pixelData[0], pixelData[1], pixelData[2]];
                    
                    setMouseCoords({ 
                        x: beadX + 1, 
                        y: beadY + 1,
                        rgb: rgb
                    });
                }
                
                // Continuar con lógica de selección si está activa
                if (isSelecting && toolMode === 'select') {

            const findClosestColor = (rgb) => {
                if (!rgb) return null;
                
                const palette = fullPalette || result?.colors?.colors || [];
                if (palette.length === 0) return null;
                
                let closest = palette[0];
                let minDistance = Infinity;
                
                palette.forEach(color => {
                    const distance = Math.sqrt(
                        Math.pow(rgb[0] - color.rgb[0], 2) +
                        Math.pow(rgb[1] - color.rgb[1], 2) +
                        Math.pow(rgb[2] - color.rgb[2], 2)
                    );
                    
                    if (distance < minDistance) {
                        minDistance = distance;
                        closest = color;
                    }
                });
                
                return closest;
            };

                    isBlankCanvas,
                    editedPattern: !!editedPattern,
                    willUseCache: lastCacheVersion === usedColorsVersion && cachedUsedColors.length > 0 && !(isBlankCanvas && !editedPattern)
                });
                
                // MODIFICAR ESTA CONDICIÓN - no usar cache si es blank canvas Y no hay editedPattern
                if (lastCacheVersion === usedColorsVersion && cachedUsedColors.length > 0 && !(isBlankCanvas && !editedPattern)) {
                    console.log('✅ Devolviendo cache:', cachedUsedColors.length, 'colores');

                }
                
                console.log('🔄 Recalculando colores desde canvas...');
                
                // Si NO hay canvas, devolver vacío
                if (!canvasRef.current) {
                    return [];
                }
                
                // Si hay resultado Y NO es blank canvas, usar result.colors
                if (result && !isBlankCanvas) {

                    setCachedUsedColors(colors);

                // Para blank canvas O cuando no hay resultado aún, analizar canvas
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const pixels = imageData.data;

                const colorSet = new Set();
                
                for (let i = 0; i < pixels.length; i += 4) {
                    const r = pixels[i];
                    const g = pixels[i + 1];
                    const b = pixels[i + 2];
                    const a = pixels[i + 3];
                    
                    if (a > 0) {
                        colorSet.add(`${r},${g},${b}`);  // ← SIN FILTRO
                    }
                }

                // AGREGAR ESTE LOG:
                console.log('🎨 Colores RGB únicos encontrados:', Array.from(colorSet));

                const uniqueColors = Array.from(colorSet).map(rgbString => {
                    const [r, g, b] = rgbString.split(',').map(Number);
                    return findClosestColor([r, g, b]);
                }).filter(c => c);

                console.log('🎨 Colores usados en canvas (analizando):', uniqueColors.length);
                
                setCachedUsedColors(uniqueColors);
                setLastCacheVersion(usedColorsVersion);
                
                return uniqueColors;
            }, [usedColorsVersion, cachedUsedColors, lastCacheVersion, isBlankCanvas, result, editedPattern]);

            const saveEdits = async () => {

                    const beadsHeight = result.pattern.height;
                    const pixelWidth = canvas.width / beadsWidth;
                    const pixelHeight = canvas.height / (beadsHeight + 0.5);
                    
                    // Contar colores bead por bead
                    const colorCounts = {};
                    let totalBeads = 0;
                    
                    for (let x = 0; x < beadsWidth; x++) {
                        const offsetY = (x % 2 === 1) ? (pixelHeight / 2) : 0;
                        for (let y = 0; y < beadsHeight; y++) {
                            const pixelX = Math.floor(x * pixelWidth + pixelWidth / 2);
                            const pixelY = Math.floor(y * pixelHeight + offsetY + pixelHeight / 2);
                            
                            const imageData = ctx.getImageData(pixelX, pixelY, 1, 1);
                            const [r, g, b] = imageData.data;
                            const colorKey = `${r},${g},${b}`;
                            
                            colorCounts[colorKey] = (colorCounts[colorKey] || 0) + 1;
                            totalBeads++;
                        }
                    }
                    
                    // Construir lista de colores desde colorCounts
                    const updatedColors = [];
                    
                    for (const colorKey in colorCounts) {
                        const [r, g, b] = colorKey.split(',').map(Number);
                        const count = colorCounts[colorKey];
                        
                        // Buscar el color en la paleta completa
                        const paletteColor = fullPalette.find(c => 
                            c.rgb[0] === r && c.rgb[1] === g && c.rgb[2] === b
                        );
                        
                        if (paletteColor) {
                            updatedColors.push({
                                ...paletteColor,
                                count: count,
                                percentage: ((count / totalBeads) * 100).toFixed(1)
                            });
                        } else {
                            // Color no está en paleta (RGB custom)
                            updatedColors.push({
                                code: `RGB-${r}-${g}-${b}`,
                                name_es: `RGB (${r}, ${g}, ${b})`,
                                name_en: `RGB (${r}, ${g}, ${b})`,
                                rgb: [r, g, b],
                                count: count,
                                percentage: ((count / totalBeads) * 100).toFixed(1)
                            });
                        }

                                                                }}
                                                                onMouseEnter={(e) => {
                                                                    if (modalSelectedColor?.code !== color.code) {
                                                                        e.currentTarget.style.border = '2px solid var(--primary)';
                                                                    }
                                                                }}
                                                                onMouseLeave={(e) => {
                                                                    if (modalSelectedColor?.code !== color.code) {
                                                                        e.currentTarget.style.border = '2px solid transparent';
                                                                    }
                                                                }}
                                                            >
                                                                <div style={{
                                                                    width: '100%',
                                                                    height: '40px',
                                                                    backgroundColor: `rgb(${color.rgb[0]},${color.rgb[1]},${color.rgb[2]})`,
                                                                    border: '1px solid var(--border)',
                                                                    borderRadius: '4px',
                                                                    marginBottom: '5px'
                                                                }} />
                                                                <div style={{fontSize: '0.7rem', fontWeight: 'bold', textAlign: 'center'}}>
                                                                    {color.code}
                                                                </div>
                                                            </div>
                                                        ))}
                                                </div>

                                                {/* Texto explicativo */}
                                                <div style={{
                                                    fontSize: '0.85rem',
                                                    color: 'var(--text-dim)',
                                                    marginBottom: '15px',
                                                    padding: '10px',
                                                    backgroundColor: 'var(--surface-light)',
                                                    borderRadius: '6px'
                                                }}>
                                                    💡 Selecciona un color de la paleta, luego elige una opción:
                                                </div>

                                                {/* Botones de acción */}
                                                <div style={{display: 'flex', flexDirection: 'column', gap: '10px'}}>
                                                    <div style={{display: 'flex', gap: '10px'}}>
                                                        <button
                                                            className="btn"
                                                            style={{flex: 1, padding: '12px'}}
                                                            onClick={() => {
                                                                if (!modalSelectedColor) {
                                                                    alert('⚠️ Primero selecciona un color');
                                                                    return;
                                                                }
                                                                
                                                                // Guardar para deshacer
                                                                setUndoHistory(canvasRef.current.toDataURL());
                                                                
                                                                const canvas = canvasRef.current;
                                                                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                                                                const isPeyote = result.pattern_type === 'peyote';
                                                                const beadsWidth = result.pattern.width;
                                                                const beadsHeight = result.pattern.height;
                                                                
                                                                // Calcular posición del pixel
                                                                if (isPeyote) {
                                                                    const pixelWidth = canvas.width / beadsWidth;
                                                                    const pixelHeight = canvas.height / (beadsHeight + 0.5);
                                                                    const offsetY = (doubleClickModal.beadX % 2 === 1) ? (pixelHeight / 2) : 0;
                                                                    
                                                                    ctx.fillStyle = `rgb(${modalSelectedColor.rgb[0]},${modalSelectedColor.rgb[1]},${modalSelectedColor.rgb[2]})`;
                                                                    ctx.fillRect(
                                                                        Math.floor(doubleClickModal.beadX * pixelWidth),
                                                                        Math.floor(doubleClickModal.beadY * pixelHeight + offsetY),
                                                                        Math.ceil(pixelWidth),
                                                                        Math.ceil(pixelHeight)
                                                                    );
                                                                    setHasUnsavedChanges(true); // Marcar que hay cambios sin guardar
                                                                } else {
                                                                    const pixelWidth = canvas.width / beadsWidth;
                                                                    const pixelHeight = canvas.height / beadsHeight;
                                                                    
                                                                    ctx.fillStyle = `rgb(${modalSelectedColor.rgb[0]},${modalSelectedColor.rgb[1]},${modalSelectedColor.rgb[2]})`;
                                                                    ctx.fillRect(
                                                                        Math.floor(doubleClickModal.beadX * pixelWidth),
                                                                        Math.floor(doubleClickModal.beadY * pixelHeight),
                                                                        Math.ceil(pixelWidth),
                                                                        Math.ceil(pixelHeight)
                                                                    );
                                                                    setHasUnsavedChanges(true); // Marcar que hay cambios sin guardar
                                                                }
                                                                
                                                                setUsedColorsVersion(v => v + 1);
                                                                setEditedPattern(canvas.toDataURL());
                                                                setDoubleClickModal(null);
                                                                setModalSelectedColor(null);
                                                            }}
                                                        >
                                                            🎯 Solo Este Pixel
                                                        </button>
                                                        <button
                                                            className="btn"
                                                            style={{flex: 1, padding: '12px', backgroundColor: 'var(--accent)'}}
                                                            onClick={() => {
                                                                if (!modalSelectedColor) {
                                                                    alert('⚠️ Primero selecciona un color');
                                                                    return;
                                                                }
                                                                
                                                                if (!canvasRef.current) {
                                                                    alert('❌ Error: No hay canvas disponible');
                                                                    return;
                                                                }
                                                                
                                                                // Guardar para deshacer
                                                                setUndoHistory(canvasRef.current.toDataURL());
                                                                
                                                                const canvas = canvasRef.current;
                                                                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                                                                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                                                                const pixels = imageData.data;
                                                                
                                                                // Color actual (del pixel clickeado)
                                                                const fromR = doubleClickModal.rgb[0];
                                                                const fromG = doubleClickModal.rgb[1];
                                                                const fromB = doubleClickModal.rgb[2];
                                                                
                                                                // Nuevo color seleccionado
                                                                const toR = modalSelectedColor.rgb[0];
                                                                const toG = modalSelectedColor.rgb[1];
                                                                const toB = modalSelectedColor.rgb[2];
                                                                
                                                                let replacedCount = 0;
                                                                
                                                                for (let i = 0; i < pixels.length; i += 4) {
                                                                    const r = pixels[i];
                                                                    const g = pixels[i + 1];
                                                                    const b = pixels[i + 2];
                                                                    
                                                                    if (r === fromR && g === fromG && b === fromB) {
                                                                        pixels[i] = toR;
                                                                        pixels[i + 1] = toG;
                                                                        pixels[i + 2] = toB;
                                                                        replacedCount++;
                                                                    }
                                                                }
                                                                
                                                                ctx.putImageData(imageData, 0, 0);
                                                                setEditedPattern(canvas.toDataURL());
                                                                
                                                                const beadsReplaced = Math.floor(replacedCount / (canvas.width * canvas.height / (result.pattern.width * result.pattern.height)));
                                                                
                                                                setUsedColorsVersion(v => v + 1);
                                                                setDoubleClickModal(null);
                                                                setModalSelectedColor(null);
                                                                
                                                                alert(`✅ Color reemplazado (≈${beadsReplaced} beads afectados)`);
                                                            }}
                                                        >
                                                            🔄 Todos Con Este Color
                                                        </button>
                                                    </div>
                                                    <button
                                                        className="btn btn-secondary"
                                                        style={{width: '100%', padding: '12px'}}
                                                        onClick={() => {
                                                            setDoubleClickModal(null);
                                                            setModalSelectedColor(null);
                                                        }}
                                                    >
                                                        ❌ Cancelar
                                                    </button>        
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Footer */}
                    <footer 
                        style={{
                            marginTop: '60px',
                            padding: '20px',
                            borderTop: '1px solid var(--border)',
                            color: 'var(--text-dim)',
                            fontSize: '0.85rem',
                            display: 'flex',
                            justifyContent: 'space-between',
                            alignItems: 'center',
                            gap: '20px',
                            flexWrap: 'wrap'
                        }}>
                        {/* Izquierda: Contacto */}
                        <div style={{textAlign: 'left'}}>
                            ¿Dudas o sugerencias?<br/>
                            📧 <a 
                                href="mailto:arapystudio@gmail.com"
                                style={{
                                    color: 'var(--primary)',
                                    textDecoration: 'none'
                                }}
                            >
                                arapystudio@gmail.com
                            </a>
                        </div>
                        
                        {/* Derecha: Copyright */}
                        <div style={{textAlign: 'right'}}>
                            Miyuki® es una marca registrada de<br/>
                            MIYUKI Co., Ltd - Japón
                        </div>
                    </footer>

                    {/* Modal de Upgrade a Premium */}
                    {showUpgradeModal && (
                        <div style={{
                            position: 'fixed',
                            top: 0,
                            left: 0,
                            right: 0,
                            bottom: 0,
                            background: 'rgba(0, 0, 0, 0.8)',
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                            zIndex: 9999
                        }}>
                            <div style={{
                                background: 'var(--surface)',
                                borderRadius: '16px',
                                padding: '30px',
                                maxWidth: '600px',
                                width: '90%',
                                maxHeight: '90vh',
                                overflow: 'auto'
                            }}>
                                <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px'}}>
                                    <h2 style={{margin: 0}}>💎 Upgrade a Premium</h2>
                                    <button 
                                        onClick={() => setShowUpgradeModal(false)}
                                        style={{
                                            background: 'none',
                                            border: 'none',
                                            fontSize: '24px',
                                            cursor: 'pointer',
                                            color: 'var(--text)'
                                        }}
                                    >
                                        ×
                                    </button>
                                </div>

                                <p style={{color: 'var(--text-dim)', marginBottom: '30px'}}>
                                    Desbloquea todas las funciones de Easy Cuentas
                                </p>

                                {/* Comparación Free vs Premium */}
                                <div style={{
                                    display: 'grid',
                                    gridTemplateColumns: '1fr 1fr',
                                    gap: '20px',
                                    marginBottom: '30px'
                                }}>
                                    {/* Plan Free */}
                                    <div style={{
                                        border: '1px solid var(--border)',
                                        borderRadius: '12px',
                                        padding: '20px'
                                    }}>
                                        <h3>🆓 Free</h3>
                                        <div style={{fontSize: '2rem', fontWeight: 'bold', marginBottom: '10px'}}>
                                            $0
                                        </div>
                                        <ul style={{listStyle: 'none', padding: 0, color: 'var(--text-dim)', fontSize: '0.9rem'}}>
                                            <li>✅ 1 patrón/mes desde foto</li>
                                            <li>✅ 3 patrones/mes desde cero</li>
                                            <li>❌ Sin descargas</li>
                                            <li>❌ Galería limitada</li>
                                        </ul>
                                    </div>

                                    {/* Plan Premium */}
                                    <div style={{
                                        border: '2px solid var(--primary)',
                                        borderRadius: '12px',
                                        padding: '20px',
                                        background: 'linear-gradient(135deg, rgba(0, 206, 209, 0.1) 0%, rgba(255, 217, 61, 0.1) 100%)'
                                    }}>
                                        <h3>💎 Premium</h3>
                                        <div style={{fontSize: '2rem', fontWeight: 'bold', marginBottom: '10px'}}>
                                            $4.99<span style={{fontSize: '1rem', fontWeight: 'normal'}}>/mes</span>
                                        </div>
                                        <ul style={{listStyle: 'none', padding: 0, fontSize: '0.9rem'}}>
                                            <li>✅ Patrones ilimitados</li>
                                            <li>✅ Descargas ilimitadas</li>
                                            <li>✅ Galería completa</li>
                                            <li>✅ Soporte prioritario</li>
                                        </ul>
                                    </div>
                                </div>

                                {/* Botones de pago */}
                                <div style={{display: 'flex', gap: '15px'}}>
                                    <button
                                        onClick={() => handleUpgrade('monthly')}
                                        style={{
                                            flex: 1,
                                            padding: '15px',
                                            background: 'var(--primary)',
                                            border: 'none',
                                            borderRadius: '8px',
                                            color: '#000000',
                                            cursor: 'pointer',
                                            fontWeight: 'bold',
                                            fontSize: '1rem'
                                        }}
                                    >
                                        Mensual - $4.99/mes
                                    </button>
                                    <button
                                        onClick={() => handleUpgrade('yearly')}
                                        style={{
                                            flex: 1,
                                            padding: '15px',
                                            background: 'linear-gradient(135deg, var(--primary) 0%, #FFD93D 100%)',
                                            border: 'none',
                                            borderRadius: '8px',
                                            color: '#000000',
                                            cursor: 'pointer',
                                            fontWeight: 'bold',
                                            fontSize: '1rem'
                                        }}
                                    >
                                        Anual - $48/año
                                        <div style={{fontSize: '0.75rem', fontWeight: 'normal'}}>
                                            (Ahorra 20%)
                                        </div>
                                    </button>
                                </div>

                                <p style={{
                                    fontSize: '0.75rem',
                                    color: 'var(--text-dim)',
                                    textAlign: 'center',
                                    marginTop: '20px'
                                }}>
                                    Pago seguro procesado por Stripe
                                </p>
                            </div>
                        </div>
                    )}                    

                </div>                                
            );
        }
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
