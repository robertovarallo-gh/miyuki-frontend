<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miyuki Pattern Generator - Professional</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;500;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #00CED1;
            --primary-dark: #008B8D;
            --accent: #FF6B9D;
            --bg: #0A0E27;
            --surface: #1A1F3A;
            --surface-light: #252B4A;
            --text: #E8EDF5;
            --text-dim: #A0AEC0;
            --success: #00E5A0;
            --border: rgba(255, 255, 255, 0.1);
        }
        
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(0, 206, 209, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 107, 157, 0.1) 0%, transparent 50%);
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 60px;
        }
        
        .header h1 {
            font-family: 'Archivo Black', sans-serif;
            font-size: 3.5rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }
        
        .header p {
            color: var(--text-dim);
            font-size: 1.1rem;
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 30px;
            align-items: start;
        }
        
        .card {
            background: var(--surface);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }
        
        .card h2 {
            font-family: 'Archivo Black', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--primary);
        }
        
        .upload-zone {
            border: 3px dashed var(--border);
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--surface-light);
        }
        
        .upload-zone:hover {
            border-color: var(--primary);
            background: rgba(0, 206, 209, 0.05);
        }
        
        .upload-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
            opacity: 0.6;
        }
        
        .preview-image {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        
        .controls-group {
            margin-bottom: 20px;
        }
        
        .controls-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 0.95rem;
        }
        
        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        input[type="number"],
        input[type="range"],
        select {
            width: 100%;
            padding: 12px 16px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        input[type="range"] {
            padding: 8px;
            height: 40px;
        }
        
        input[type="number"]:focus,
        input[type="range"]:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 206, 209, 0.1);
        }

        .slider-value {
            display: inline-block;
            min-width: 40px;
            text-align: center;
            font-weight: 600;
            color: var(--primary);
        }
        
        .btn {
            width: 100%;
            padding: 16px 32px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'DM Sans', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 206, 209, 0.3);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--accent) 0%, #ff4081 100%);
        }
        
        .info-text {
            background: rgba(0, 206, 209, 0.1);
            border-left: 4px solid var(--primary);
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 0.9rem;
        }

        .collapsible-section {
            margin-top: 15px;
            border-top: 1px solid var(--border);
            padding-top: 15px;
        }

        .collapse-toggle {
            background: transparent;
            border: none;
            color: var(--primary);
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 8px 0;
            width: 100%;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .collapse-toggle:hover {
            color: var(--text);
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border);
            flex-wrap: wrap;
        }
        
        .tab {
            padding: 12px 20px;
            background: transparent;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s ease;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }
        
        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        
        .tab:hover {
            color: var(--text);
        }
        
        /* === RESPONSIVE MOBILE STYLES === */
        @media (max-width: 768px) {
            .tabs {
                gap: 5px;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
            }
            
            .tabs::-webkit-scrollbar {
                display: none;
            }
            
            .tab {
                padding: 10px 14px;
                font-size: 0.85rem;
                flex-shrink: 0;
                white-space: nowrap;
            }
        }

        @media (max-width: 480px) {
            .tab {
                padding: 8px 10px;
                font-size: 0.8rem;
            }
        }

        .pattern-canvas {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        
        .loading {
            text-align: center;
            padding: 60px 20px;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-dim);
        }
        
        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.3;
        }
        
        .color-legend {
            display: grid;
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
        }
        
        .color-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 10px;
            background: var(--surface-light);
            border-radius: 8px;
        }
        
        .color-swatch {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            border: 2px solid var(--border);
            flex-shrink: 0;
        }
        
        .color-info {
            flex: 1;
            font-size: 0.9rem;
        }
        
        .color-code {
            font-weight: 700;
            color: var(--primary);
        }
        
        .color-miyuki {
            color: var(--text-dim);
            font-size: 0.85rem;
        }
        
        .row-guide {
            max-height: 500px;
            overflow-y: auto;
            font-size: 0.9rem;
        }
        
        .row-item {
            padding: 15px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 10px;
        }
        
        .row-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }
        
        .row-number {
            font-weight: 700;
            color: var(--primary);
            font-size: 1.1rem;
            min-width: 50px;
        }
        
        .row-totals {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-dim);
        }
        
        .row-sequence {
            background: var(--surface-light);
            padding: 12px;
            border-radius: 8px;
            margin-top: 8px;
        }
        
        .sequence-label {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .sequence-items {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }
        
        .sequence-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 10px;
            background: var(--surface);
            border-radius: 6px;
            font-size: 0.9rem;
            border: 1px solid var(--border);
        }
        
        .sequence-arrow {
            color: var(--primary);
            font-size: 0.8rem;
        }
        
        .mini-swatch {
            width: 12px;
            height: 12px;
            border-radius: 2px;
            border: 1px solid var(--border);
        }

        /* Editor Styles */
        .editor-container {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .editor-canvas-wrapper {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 100%;
            overflow: auto;
        }

        .editor-canvas {
            max-width: 100% !important;
            width: auto !important;
            height: auto !important;
            display: block;
        }

        .color-palette {
            width: 100%;
            max-width: 400px;
            background: var(--surface-light);
            padding: 15px;
            border-radius: 10px;
        }

        .color-palette h3 {
            margin-bottom: 15px;
            font-size: 1.1rem;
            color: var(--primary);
        }

        .palette-colors {
            display: grid;
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
        }

        .palette-color {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }

        .palette-color:hover {
            background: var(--surface);
        }

        .palette-color.selected {
            border-color: var(--primary);
            background: var(--surface);
        }

        .palette-swatch {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            border: 2px solid var(--border);
        }

        .palette-info {
            flex: 1;
            font-size: 0.85rem;
        }

        .editor-info {
            background: rgba(0, 206, 209, 0.1);
            border-left: 4px solid var(--primary);
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 0.85rem;
        }
        
        @media (max-width: 968px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 2.5rem;
            }
            .editor-container {
                flex-direction: column;
            }
            .color-palette {
                width: 100%;
            }
        }
        
        .api-error {
            background: rgba(255, 107, 157, 0.1);
            border-left: 4px solid var(--accent);
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.7;
                transform: scale(0.98);
            }
        }

    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useMemo, useCallback } = React;

        // API Configuration - Auto-detect environment
        const API_URL = window.location.hostname === 'localhost' 
            ? 'http://localhost:5000/api'
            : 'https://miyuki-backend.onrender.com/api';

        function App() {
            const [image, setImage] = useState(null);
            const [width, setWidth] = useState(5.0);
            const [height, setHeight] = useState(5.0);            
            const [beadSize, setBeadSize] = useState(1.5);
            const [dimensionMode, setDimensionMode] = useState('cm'); // 'cm' o 'beads'
            const [colorCount, setColorCount] = useState(10);
            const [colorMode, setColorMode] = useState('miyuki'); // 'miyuki' or 'rgb'
            const [creationMode, setCreationMode] = useState('photo'); // 'photo' o 'scratch'
            const [blankPattern, setBlankPattern] = useState(null);
            const [isBlankCanvas, setIsBlankCanvas] = useState(false);
            const [fullPalette, setFullPalette] = useState(null);
            const [patternType, setPatternType] = useState('grid'); // 'grid' o 'peyote'
            const [imageDimensions, setImageDimensions] = useState(null);
            
            // Color adjustment controls
            const [saturation, setSaturation] = useState(1.2);
            const [brightness, setBrightness] = useState(1.0);
            const [contrast, setContrast] = useState(1.1);
            const [sharpness, setSharpness] = useState(1.0);
            const [showAdvanced, setShowAdvanced] = useState(false);
            
            const [processing, setProcessing] = useState(false);
            const [result, setResult] = useState(null);
            const [activeTab, setActiveTab] = useState('grid');
            const [lastViewedTab, setLastViewedTab] = useState('grid'); // Para saber qué imagen cargar en el editor
            const [error, setError] = useState(null);
            const [apiConnected, setApiConnected] = useState(false);
            const [editMode, setEditMode] = useState(false);
            const [selectedColor, setSelectedColor] = useState(null);
            const [toolMode, setToolMode] = useState('paint'); // 'paint', 'select', 'paste'
            const [selection, setSelection] = useState(null); // {startX, startY, endX, endY}
            const [clipboard, setClipboard] = useState(null); // Área copiada
            const [isSelecting, setIsSelecting] = useState(false);
            const [editedPattern, setEditedPattern] = useState(null);
            const [showNumbers, setShowNumbers] = useState(false);  // ← AGREGAR
            const fileInputRef = useRef(null);
            const canvasRef = useRef(null);
            const [replaceFromColor, setReplaceFromColor] = useState(null);
            const [replaceToColor, setReplaceToColor] = useState(null);
            const [replaceSelectingMode, setReplaceSelectingMode] = useState(null); // 'from' o 'to'
            const [mouseCoords, setMouseCoords] = useState(null); // {x, y} coordenadas del píxel bajo el mouse
            const loadPatternInputRef = useRef(null);
            const [undoHistory, setUndoHistory] = useState(null); // Guardar estado anteriores para deshacer
            const [menuCollapsed, setMenuCollapsed] = useState(false);
            const [paletteTab, setPaletteTab] = useState('used'); // 'used' o 'all'
            const [usedColorsVersion, setUsedColorsVersion] = useState(0);
            const [selectedCategory, setSelectedCategory] = useState('all'); // 'all' o categoría específica
            const [searchText, setSearchText] = useState('');
            const [doubleClickModal, setDoubleClickModal] = useState(null); // {x, y, color, pixelX, pixelY}
            const [modalPaletteTab, setModalPaletteTab] = useState('used'); // 'used' o 'all'
            const [modalSearchText, setModalSearchText] = useState('');
            const [modalSelectedCategory, setModalSelectedCategory] = useState('all');
            const [clickTimeout, setClickTimeout] = useState(null);
            const [modalSelectedColor, setModalSelectedColor] = useState(null);
            const [cachedUsedColors, setCachedUsedColors] = useState([]);
            const [lastCacheVersion, setLastCacheVersion] = useState(-1);

            const CATEGORIES = {
                'all': { emoji: '🎨', name: 'Todos' },
                'rojos': { emoji: '🔴', name: 'Rojos' },
                'rosas': { emoji: '🩷', name: 'Rosas' },
                'naranjas': { emoji: '🟠', name: 'Naranjas' },
                'amarillos': { emoji: '🟡', name: 'Amarillos' },
                'verdes': { emoji: '🟢', name: 'Verdes' },
                'azules': { emoji: '🔵', name: 'Azules' },
                'morados': { emoji: '🟣', name: 'Morados' },
                'blancos': { emoji: '⚪', name: 'Blancos' },
                'grises': { emoji: '⚫', name: 'Grises' },
                'negros': { emoji: '⬛', name: 'Negros' },
                'metalicos': { emoji: '✨', name: 'Metálicos' }
            };            

            useEffect(() => {
                checkApiConnection();
                // Retry connection every 5 seconds if not connected
                const interval = setInterval(() => {
                    if (!apiConnected) {
                        checkApiConnection();
                    }
                }, 5000);
                return () => clearInterval(interval);
            }, [apiConnected]);

            useEffect(() => {
                // Limpiar cache cuando cambia el resultado
                setCachedUsedColors([]);
                setLastCacheVersion(-1);
            }, [result]);            

            // Draw edited pattern on canvas
            useEffect(() => {
                console.log('🔍 useEffect canvas - editedPattern:', editedPattern);
                console.log('🔍 useEffect canvas - canvasRef.current:', canvasRef.current);
                console.log('🔍 useEffect canvas - activeTab:', activeTab);
                console.log('🔍 useEffect canvas - lastViewedTab:', lastViewedTab);
                console.log('🔍 useEffect canvas - isBlankCanvas:', isBlankCanvas);
                console.log('🔍 useEffect canvas - pattern_type:', result?.pattern_type);

                if (canvasRef.current && activeTab === 'editor' && result?.images) {
                    const canvas = canvasRef.current;
                    const ctx = canvas.getContext('2d');
                    const img = new Image();
                    
                    // Determinar qué imagen cargar basándose en lastViewedTab
                    let imageToLoad;
                    if (lastViewedTab === 'coords' && result.images.coordinates) {
                        imageToLoad = result.images.coordinates;
                        console.log('✅ useEffect: Cargando COORDENADAS');
                    } else {
                        imageToLoad = result.images.grid;
                        console.log('✅ useEffect: Cargando GRID');
                    }
                    
                    img.onload = () => {
                        console.log('✅ Image loaded, drawing on canvas');
                        console.log('📐 Image dimensions:', img.width, 'x', img.height);
                        console.log('📐 Canvas before resize:', canvas.width, 'x', canvas.height);
                        canvas.width = img.width;
                        canvas.height = img.height;
                        console.log('📐 Canvas after resize:', canvas.width, 'x', canvas.height);
                        ctx.imageSmoothingEnabled = false;
                        ctx.drawImage(img, 0, 0);
                        console.log('✅ Image drawn on canvas');

                        // Dibujar grid en el editor
                        const beadsWidth = result.pattern.width;
                        const beadsHeight = result.pattern.height;
                        const isPeyote = result.pattern_type === 'peyote';
                        
                        ctx.strokeStyle = 'rgba(220, 220, 220, 0.3)';
                        ctx.lineWidth = 1;

                        if (isPeyote) {
                            // Grid para PEYOTE (columnas escalonadas verticalmente)
                            console.log('✅ Dibujando grid PEYOTE');
                            const pixelWidth = canvas.width / beadsWidth;
                            const pixelHeight = canvas.height / (beadsHeight + 0.5);
                            
                            // Líneas verticales (columnas)
                            for (let x = 0; x <= beadsWidth; x++) {
                                ctx.beginPath();
                                ctx.moveTo(x * pixelWidth, 0);
                                ctx.lineTo(x * pixelWidth, canvas.height);
                                ctx.stroke();
                            }

                            // Líneas horizontales escalonadas
                            for (let x = 0; x < beadsWidth; x++) {
                                const offsetY = (x % 2 === 1) ? (pixelHeight / 2) : 0;
                                for (let y = 0; y <= beadsHeight; y++) {
                                    ctx.beginPath();
                                    ctx.moveTo(x * pixelWidth, y * pixelHeight + offsetY);
                                    ctx.lineTo((x + 1) * pixelWidth, y * pixelHeight + offsetY);
                                    ctx.stroke();
                                }
                            }
                        } else {
                            // Grid para CUADRÍCULA (normal)
                            console.log('✅ Dibujando grid CUADRÍCULA');
                            const pixelWidth = canvas.width / beadsWidth;
                            const pixelHeight = canvas.height / beadsHeight;

                            // Líneas verticales
                            for (let x = 0; x <= beadsWidth; x++) {
                                ctx.beginPath();
                                ctx.moveTo(x * pixelWidth, 0);
                                ctx.lineTo(x * pixelWidth, canvas.height);
                                ctx.stroke();
                            }

                            // Líneas horizontales
                            for (let y = 0; y <= beadsHeight; y++) {
                                ctx.beginPath();
                                ctx.moveTo(0, y * pixelHeight);
                                ctx.lineTo(canvas.width, y * pixelHeight);
                                ctx.stroke();
                            }
                        }

                        console.log('✅ Grid dibujado en editor');
                    };
                    
                    img.onerror = () => {
                        console.error('❌ Error loading image');
                    };

                    console.log('🔍 Loading image:', imageToLoad);
                    img.src = imageToLoad;
                }
            }, [activeTab, lastViewedTab, result]); 
            
            const checkApiConnection = async () => {
                try {
                    const response = await fetch(`${API_URL}/health`, { 
                        signal: AbortSignal.timeout(10000) // 10 second timeout
                    });
                    const data = await response.json();
                    setApiConnected(data.status === 'ok');
                } catch (err) {
                    setApiConnected(false);
                }
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file && file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        // AGREGADO: Crear objeto Image para obtener dimensiones
                        const img = new Image();
                        img.onload = () => {
                            setImage(event.target.result);
                            
                            // AGREGADO: Guardar dimensiones de la imagen
                            setImageDimensions({
                                width: img.width,
                                height: img.height,
                                aspectRatio: img.width / img.height
                            });
                            
                            setResult(null);
                            setError(null);
                            setEditMode(false);

                            // AGREGAR ESTAS LÍNEAS:
                            setCachedUsedColors([]);
                            setLastCacheVersion(-1);

                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleDrop = (e) => {

                    beadX = Math.floor(canvasClickX / pixelWidth);

                const beadsWidth = result.pattern.width;
                const beadsHeight = result.pattern.height;
                
                const beadX = Math.floor((e.clientX - rect.left) / rect.width * beadsWidth);
                const beadY = Math.floor((e.clientY - rect.top) / rect.height * beadsHeight);
                
                setIsSelecting(true);
                setSelection({
                    startX: beadX,
                    startY: beadY,
                    endX: beadX,
                    endY: beadY
                });
            };

            const handleMouseMove = (e) => {
                if (!canvasRef.current || !result) return;
                
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const beadsWidth = result.pattern.width;
                const beadsHeight = result.pattern.height;
                
                const beadX = Math.floor((e.clientX - rect.left) / rect.width * beadsWidth);
                const beadY = Math.floor((e.clientY - rect.top) / rect.height * beadsHeight);
                
                // Actualizar coordenadas del mouse siempre (para mostrar en UI) y el color del pixel
                if (beadX >= 0 && beadX < beadsWidth && beadY >= 0 && beadY < beadsHeight) {
                    // Obtener color del pixel en la posición correcta
                    const ctx = canvas.getContext('2d');
                    const pixelWidth = canvas.width / beadsWidth;
                    const pixelHeight = canvas.height / beadsHeight;
                    const pixelData = ctx.getImageData(
                        Math.floor(beadX * pixelWidth + pixelWidth / 2),
                        Math.floor(beadY * pixelHeight + pixelHeight / 2),
                        1, 1
                    ).data;
                    
                    const rgb = [pixelData[0], pixelData[1], pixelData[2]];
                    
                    setMouseCoords({ 
                        x: beadX + 1, 
                        y: beadY + 1,
                        rgb: rgb
                    });
                }
                
                // Continuar con lógica de selección si está activa
                if (isSelecting && toolMode === 'select') {
                    setSelection(prev => ({
                        ...prev,
                        endX: beadX,
                        endY: beadY
                    }));
                }
            };

            const handleMouseLeave = () => {
                setMouseCoords(null); // Limpiar coordenadas cuando sale el mouse
            };

            const findClosestColor = (rgb) => {
                if (!rgb) return null;
                
                const palette = fullPalette || result?.colors?.colors || [];
                if (palette.length === 0) return null;
                
                let closest = palette[0];
                let minDistance = Infinity;
                
                palette.forEach(color => {
                    const distance = Math.sqrt(
                        Math.pow(rgb[0] - color.rgb[0], 2) +
                        Math.pow(rgb[1] - color.rgb[1], 2) +
                        Math.pow(rgb[2] - color.rgb[2], 2)
                    );
                    
                    if (distance < minDistance) {
                        minDistance = distance;
                        closest = color;
                    }
                });
                
                return closest;
            };

            const handleUndo = () => {
                if (!undoHistory || !canvasRef.current) return;
                
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const img = new Image();
                
                img.onload = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                    setUndoHistory(null); // Limpiar historial después de deshacer
                };
                
                img.src = undoHistory;
            };

            const handleMouseUp = () => {
                if (isSelecting) {
                    setIsSelecting(false);
                    console.log('✅ Área seleccionada:', selection);
                }
            };

            const handlePasteClick = (e) => {
                if (toolMode !== 'paste' || !clipboard || !canvasRef.current) return;

                // Guardar para deshacer
                setUndoHistory(canvasRef.current.toDataURL());
                
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                
                // Calcular posición del click en beads
                const beadsWidth = result.pattern.width;
                const beadsHeight = result.pattern.height;
                const beadX = Math.floor((e.clientX - rect.left) / rect.width * beadsWidth);
                const beadY = Math.floor((e.clientY - rect.top) / rect.height * beadsHeight);
                
                console.log(`📐 Pegando en (${beadX}, ${beadY})`);
                
                // Calcular píxeles en canvas
                const pixelWidth = canvas.width / beadsWidth;
                const pixelHeight = canvas.height / beadsHeight;
                
                const x = Math.floor(beadX * pixelWidth);
                const y = Math.floor(beadY * pixelHeight);
                
                // Pegar imageData
                ctx.putImageData(clipboard.imageData, x, y);

                setUsedColorsVersion(v => v + 1); // Actualizar colores usados 
                
                // Guardar cambios
                const newPattern = canvas.toDataURL();
                setEditedPattern(newPattern);
                
                console.log('✅ Área pegada');
            };

            const handleEraseClick = (e) => {
                if (toolMode !== 'erase' || !canvasRef.current) return;

                // Guardar para deshacer
                setUndoHistory(canvasRef.current.toDataURL());

                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const beadsWidth = result.pattern.width;
                const beadsHeight = result.pattern.height;
                
                const beadX = Math.floor((e.clientX - rect.left) / rect.width * beadsWidth);
                const beadY = Math.floor((e.clientY - rect.top) / rect.height * beadsHeight);

                const pixelWidth = canvas.width / beadsWidth;
                const pixelHeight = canvas.height / beadsHeight;
                
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                ctx.fillStyle = 'rgb(255, 255, 255)'; // Blanco puro
                ctx.fillRect(
                    Math.floor(beadX * pixelWidth), 
                    Math.floor(beadY * pixelHeight), 
                    Math.ceil(pixelWidth), 
                    Math.ceil(pixelHeight)
                );

                const newPattern = canvas.toDataURL();
                setEditedPattern(newPattern);
            };

            const getUsedColors = useCallback(() => {
                console.log('🔍 getUsedColors llamado:', {
                    hasCache: cachedUsedColors.length > 0,
                    lastCacheVersion,
                    usedColorsVersion,
                    isBlankCanvas,
                    editedPattern: !!editedPattern,
                    willUseCache: lastCacheVersion === usedColorsVersion && cachedUsedColors.length > 0 && !(isBlankCanvas && !editedPattern)
                });
                
                // MODIFICAR ESTA CONDICIÓN - no usar cache si es blank canvas Y no hay editedPattern
                if (lastCacheVersion === usedColorsVersion && cachedUsedColors.length > 0 && !(isBlankCanvas && !editedPattern)) {
                    console.log('✅ Devolviendo cache:', cachedUsedColors.length, 'colores');
                    return cachedUsedColors;
                }
                
                console.log('🔄 Recalculando colores desde canvas...');
                
                // Si NO hay canvas, devolver vacío
                if (!canvasRef.current) {
                    return [];
                }
                
                // Si hay resultado Y NO es blank canvas, usar result.colors
                if (result && !isBlankCanvas) {
                    const colors = result.colors?.colors || [];
                    console.log('🎨 Usando colores del resultado:', colors.length);
                    setCachedUsedColors(colors);
                    setLastCacheVersion(usedColorsVersion);
                    return colors;
                }

                // Para blank canvas O cuando no hay resultado aún, analizar canvas
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const pixels = imageData.data;

                const colorSet = new Set();
                
                for (let i = 0; i < pixels.length; i += 4) {
                    const r = pixels[i];
                    const g = pixels[i + 1];
                    const b = pixels[i + 2];
                    const a = pixels[i + 3];
                    
                    if (a > 0) {
                        // Ignorar grises muy claros del grid (215-255)
                        const isGridGray = r >= 215 && g >= 215 && b >= 215 && r === g && g === b;
                        
                        if (!isGridGray) {
                            colorSet.add(`${r},${g},${b}`);
                        }
                    }
                }

                // AGREGAR ESTE LOG:
                console.log('🎨 Colores RGB únicos encontrados:', Array.from(colorSet));

                const uniqueColors = Array.from(colorSet).map(rgbString => {
                    const [r, g, b] = rgbString.split(',').map(Number);
                    return findClosestColor([r, g, b]);
                }).filter(c => c);

                console.log('🎨 Colores usados en canvas (analizando):', uniqueColors.length);
                
                setCachedUsedColors(uniqueColors);
                setLastCacheVersion(usedColorsVersion);
                
                return uniqueColors;
            }, [usedColorsVersion, cachedUsedColors, lastCacheVersion, isBlankCanvas, result, editedPattern]);

            const saveEdits = async () => {
                 if (!canvasRef.current) return;

                const canvas = canvasRef.current;
                const editedImageData = canvas.toDataURL();
                
                setEditedPattern(editedImageData);
                
                const isPeyote = result.pattern_type === 'peyote';
                
                // Si es PEYOTE, actualizar análisis de colores manualmente
                if (isPeyote) {
                    // Analizar colores del canvas editado
                    const ctx = canvas.getContext('2d', { willReadFrequently: true });
                    const beadsWidth = result.pattern.width;
                    const beadsHeight = result.pattern.height;
                    const pixelWidth = canvas.width / beadsWidth;
                    const pixelHeight = canvas.height / (beadsHeight + 0.5);
                    
                    // Contar colores bead por bead
                    const colorCounts = {};
                    let totalBeads = 0;
                    
                    for (let x = 0; x < beadsWidth; x++) {
                        const offsetY = (x % 2 === 1) ? (pixelHeight / 2) : 0;
                        for (let y = 0; y < beadsHeight; y++) {
                            // Obtener color del centro del bead
                            const pixelX = Math.floor(x * pixelWidth + pixelWidth / 2);
                            const pixelY = Math.floor(y * pixelHeight + offsetY + pixelHeight / 2);
                            
                            const imageData = ctx.getImageData(pixelX, pixelY, 1, 1);
                            const [r, g, b] = imageData.data;
                            const colorKey = `${r},${g},${b}`;
                            
                            colorCounts[colorKey] = (colorCounts[colorKey] || 0) + 1;
                            totalBeads++;
                        }
                    }
                    
                    // Actualizar conteos en result.colors
                    const updatedColors = result.colors.colors.map(color => {
                        const colorKey = `${color.rgb[0]},${color.rgb[1]},${color.rgb[2]}`;
                        const count = colorCounts[colorKey] || 0;
                        return {
                            ...color,
                            count: count,
                            percentage: ((count / totalBeads) * 100).toFixed(1)
                        };
                    }).filter(color => color.count > 0); // Solo mantener colores usados
                    
                    // Actualizar resultado
                    setResult({
                        ...result,
                        images: {
                            ...result.images,
                            grid: editedImageData,
                            basic: editedImageData
                        },
                        colors: {
                            ...result.colors,
                            colors: updatedColors,
                            unique_colors: updatedColors.length,
                            total_beads: totalBeads
                        }
                    });
                    
                    setEditMode(false);
                    setActiveTab('grid');
                    setUsedColorsVersion(v => v + 1); // Forzar actualización de paleta
                    setIsBlankCanvas(false);  // ← AGREGAR ESTA LÍNEA
                    alert('✅ Patrón peyote guardado y colores actualizados');
                    return;
                }
                
                // Para CUADRÍCULA, continuar con el flujo normal
                if (isBlankCanvas) {
                    setProcessing(true);
                    try {
                        const widthToSend =
                            dimensionMode === 'cm'
                                ? Number(width)
                                : Number(((width * beadSize) / 10).toFixed(1));

                        const heightToSend =
                            dimensionMode === 'cm'
                                ? Number(height)
                                : Number(((height * beadSize) / 10).toFixed(1));

                        const response = await fetch(`${API_URL}/generate`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                image: editedImageData,
                                width: widthToSend,
                                height: heightToSend,
                                beadSize: beadSize,
                                numColors: 100,
                                saturation: 1.0,
                                brightness: 1.0,
                                contrast: 1.0,
                                sharpness: 1.0,
                                showGrid: true,
                                showNumbers: false,
                                colorMode: colorMode,
                                skipQuantization: true,
                                pattern_type: result.pattern_type
                            })
                        });
                        
                        const data = await response.json();
                        
                        if (data.success) {
                            setResult({
                                ...data,
                                images: {
                                    grid: data.images.grid,
                                    coordinates: data.images.coordinates,
                                    basic: editedImageData
                                }
                            });
                            setEditedPattern(editedImageData);
                            setActiveTab('grid');
                            setIsBlankCanvas(false);  // ← AGREGAR ESTA LÍNEA
                            setUsedColorsVersion(v => v + 1);  // ← Y ESTA TAMBIÉN (para actualizar cache)
                            setProcessing(false);
                            alert('✅ Cambios guardados y guías actualizadas.');
                        }
                    } catch (err) {
                        setError('Error guardando ediciones: ' + err.message);
                        setProcessing(false);
                    }
                    return;
                }
                
                // Si es desde foto cuadrícula, regenerar normalmente
                setProcessing(true);

                const widthToSend =
                    dimensionMode === 'cm'
                        ? Number(width)
                        : Number(((width * beadSize) / 10).toFixed(1));

                const heightToSend =
                    dimensionMode === 'cm'
                        ? Number(height)
                        : Number(((height * beadSize) / 10).toFixed(1));

                try {
                    const response = await fetch(`${API_URL}/generate`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            image: editedImageData,
                            width: widthToSend,
                            height: heightToSend,
                            beadSize: beadSize,
                            numColors: colorCount,
                            saturation: saturation,
                            brightness: brightness,
                            contrast: contrast,
                            sharpness: sharpness,
                            showGrid: true,
                            showNumbers: false,
                            colorMode: colorMode,
                            skipQuantization: true,
                            pattern_type: result.pattern_type
                        })
                    });
                    
                    const data = await response.json();
                    if (data.success) {
                        setResult(data);
                        setEditedPattern(data.images.grid);
                        setEditMode(false);
                        setActiveTab('grid');

                        const palette = await loadFullPalette();
                        setFullPalette(palette);
                    }
                } catch (err) {
                    setError('Error guardando ediciones: ' + err.message);
                } finally {
                    setProcessing(false);
                }
            };

            const createBlankCanvas = async () => {
                setProcessing(true);
                setError(null);

                // AGREGAR ESTAS LÍNEAS AL INICIO:
                setCachedUsedColors([]);
                setLastCacheVersion(-1);
                setUsedColorsVersion(v => v + 1);  // ← MOVER AQUÍ PRIMERO
                
                try {
                    // Calculate dimensions in beads
                    const widthBeads =
                        dimensionMode === 'beads'
                            ? width
                            : Math.round((width * 10) / beadSize);
                    // const widthBeads = Math.round((width * 10) / beadSize);
                    
                    const heightBeads =
                        dimensionMode === 'beads'
                            ? height
                            : Math.round((height * 10) / beadSize);    
                    // const heightBeads = Math.round((height * 10) / beadSize);

                    console.log('📐 Creando canvas blanco:', widthBeads, 'x', heightBeads, 'beads');
                    
                    // Create blank white canvas
                    const canvas = document.createElement('canvas');
                    const pixelsPerBead = 20; // Same as backend
                    canvas.width = widthBeads * pixelsPerBead;
                    canvas.height = heightBeads * pixelsPerBead;

                    console.log('📐 Canvas scaled:', canvas.width, 'x', canvas.height);

                    const ctx = canvas.getContext('2d');
                    
                    // Fill with white 
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // Draw grid on blank canvas
                    ctx.strokeStyle = 'rgb(200, 200, 200)';
                    ctx.lineWidth = 1;

                    // Vertical lines
                    for (let x = 0; x <= widthBeads; x++) {
                        ctx.beginPath();
                        ctx.moveTo(x * pixelsPerBead, 0);
                        ctx.lineTo(x * pixelsPerBead, canvas.height);
                        ctx.stroke();
                    }

                    // Horizontal lines
                    for (let y = 0; y <= heightBeads; y++) {
                        ctx.beginPath();
                        ctx.moveTo(0, y * pixelsPerBead);
                        ctx.lineTo(canvas.width, y * pixelsPerBead);
                        ctx.stroke();
                    }
                    
                    console.log('✅ Grid dibujado en canvas blanco');

                    // ESTE BLOQUE DEBE ESTAR AQUÍ:
                    console.log('🔄 Reemplazando grises del grid por blanco puro...');

                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const pixels = imageData.data;

                    let replacedPixels = 0;

                    for (let i = 0; i < pixels.length; i += 4) {
                        const r = pixels[i];
                        const g = pixels[i + 1];
                        const b = pixels[i + 2];
                        
                        if (r >= 180 && r <= 255 && g >= 180 && g <= 255 && b >= 180 && b <= 255) {
                            pixels[i] = 255;
                            pixels[i + 1] = 255;
                            pixels[i + 2] = 255;
                            replacedPixels++;
                        }
                    }

                    ctx.putImageData(imageData, 0, 0);
                    console.log(`✅ ${replacedPixels} píxeles grises reemplazados por blanco`);
                    
                    console.log('🎨 Verificando canvas antes de enviar....');

                    // Verificar que el grid se dibujó
                    const testPixel = ctx.getImageData(pixelsPerBead, pixelsPerBead, 1, 1).data;
                    console.log('Pixel después del grid:', testPixel);

                    // Convert to base64
                    const blankImage = canvas.toDataURL('image/png');
                    
                    // Set as image and generate pattern
                    setBlankPattern(blankImage);
                    setImage(blankImage);

                    const widthToSend =
                        dimensionMode === 'cm'
                            ? Number(width)
                            : Number(((width * beadSize) / 10).toFixed(1)); // beads -> cm

                    const heightToSend =
                        dimensionMode === 'cm'
                            ? Number(height)
                            : Number(((height * beadSize) / 10).toFixed(1)); // beads -> cm
                    
                    // Call backend to generate pattern (same as from photo)
                    const response = await fetch(`${API_URL}/generate`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            image: blankImage,
                            width: widthToSend,
                            height: heightToSend,
                            beadSize: beadSize,
                            numColors: 1, // Only white for blank canvas
                            saturation: 1.0,
                            brightness: 1.0,
                            contrast: 1.0,
                            sharpness: 1.0,
                            pattern_type: patternType, // NUEVA LÍNEA
                            showGrid: false, // No need to show grid since it's already part of the image
                            showNumbers: false,
                            colorMode: colorMode
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        
                        setResult(data);
                        setIsBlankCanvas(true);
                        setPaletteTab('all');
                        setEditMode(true);
                        setActiveTab('grid');
                        setEditedPattern(data.images.grid); 
                        
                        // Load full palette
                        const palette = await loadFullPalette();
                        setFullPalette(palette);
                        
                        setProcessing(false);
                    } else {
                        setError(data.error || 'Error al crear patrón');
                        setProcessing(false);
                    }
                    
                } catch (err) {
                    setError('Error al crear canvas: ' + err.message);
                    setProcessing(false);
                }
            };

            const getFullPalette = () => {
                if (colorMode === 'miyuki') {
                    // Retornar los 70 colores Miyuki en formato compatible
                    // Por ahora, usamos los del resultado si existen, sino mostramos mensaje
                    return result?.colors?.colors || [];
                } else {
                    // Retornar los 200 colores RGB
                    return result?.colors?.colors || [];
                }
            };

            const loadFullPalette = async () => {
                try {
                    const response = await fetch(`${API_URL}/get-palette`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            colorMode: colorMode
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        // Ordenar por código antes de retornar
                        const sortedPalette = data.palette.sort((a, b) => {
                            return a.code.localeCompare(b.code);
                        });
                        return data.palette;
                    } else {
                        console.error('Error loading palette:', data.error);
                        return [];
                    }
                } catch (err) {
                    console.error('Error fetching palette:', err);
                    return [];
                }
            };

            const widthBeads = Math.round((width * 10) / beadSize);
            const heightBeads = Math.round((height * 10) / beadSize);
            const totalBeads = widthBeads * heightBeads;

            return (
                <div className="container">
                    {/* Input oculto para cargar patrones guardados */}
                    <input 
                        ref={loadPatternInputRef}
                        type="file" 
                        accept=".json"
                        onChange={loadPattern}
                        style={{display: 'none'}}
                    />
                    
                    <header className="header">
                        <h1>🎨 Miyuki Pattern Generator</h1>
                        <p>Convierte tus fotos en patrones profesionales de cuentas Miyuki</p>
                        {!apiConnected && (
                            <div className="api-error" style={{maxWidth: '600px', margin: '20px auto', padding: '20px', borderRadius: '10px'}}>
                                <div style={{fontSize: '1.2rem', marginBottom: '10px'}}>⏳ Conectando al servidor...</div>
                                <p style={{fontSize: '0.9rem', margin: '5px 0'}}>
                                    El servidor gratuito puede tardar <strong>30-60 segundos</strong> en activarse si ha estado inactivo.
                                </p>
                                <p style={{fontSize: '0.85rem', marginTop: '10px', opacity: 0.8}}>
                                    💡 Si este mensaje persiste, intenta refrescar la página.
                                </p>
                            </div>
                        )}
                    </header>                        
                        <div className="main-grid" style={{
                            gridTemplateColumns: menuCollapsed ? '60px 1fr' : '400px 1fr'
                        }}>
                        <div>
                            {/* Botón colapsar/expandir */}
                            <button
                                onClick={() => setMenuCollapsed(!menuCollapsed)}
                                style={{
                                    width: '100%',
                                    padding: '15px',
                                    marginBottom: '20px',
                                    backgroundColor: 'var(--surface)',
                                    border: '1px solid var(--border)',
                                    borderRadius: '10px',
                                    color: 'var(--text)',
                                    cursor: 'pointer',
                                    fontSize: menuCollapsed ? '1rem' : '1.1rem',
                                    display: 'flex',
                                    alignItems: 'center',
                                    justifyContent: 'center',
                                    gap: '8px'
                                }}
                            >
                                {menuCollapsed ? (
                                    <>
                                        <span style={{fontSize: '1.2rem'}}>▶️</span>
                                        <span style={{writingMode: 'vertical-rl', transform: 'rotate(180deg)'}}>
                                            Expandir
                                        </span>
                                    </>
                                ) : (
                                    <>
                                        <span>◀️</span>
                                        <span>Contraer Menu Lateral</span>
                                    </>
                                )}
                            </button>

                            {/* Contenido del menú (ocultar si está colapsado) */}
                            {!menuCollapsed && (
                                <>
                                    {/* Toggle Modo de Creación */}
                                    <div className="card" style={{marginBottom: '20px'}}>
                                        <div style={{display: 'flex', gap: '10px'}}>
                                            <button 
                                                onClick={() => setCreationMode('photo')}
                                                style={{
                                                    flex: 1,
                                                    padding: '15px',
                                                    backgroundColor: creationMode === 'photo' ? 'var(--primary)' : '#e0e0e0',
                                                    color: creationMode === 'photo' ? '#000000' : '#666666',
                                                    border: 'none',
                                                    borderRadius: '8px',
                                                    fontWeight: creationMode === 'photo' ? 'bold' : 'normal',

                                                    cursor: 'pointer'
                                                }}
                                            >
                                                📸 Desde Foto
                                            </button>
                                            <button 
                                                onClick={() => setCreationMode('scratch')}
                                                style={{
                                                    flex: 1,
                                                    padding: '15px',
                                                    backgroundColor: creationMode === 'scratch' ? 'var(--primary)' : '#e0e0e0',
                                                    color: creationMode === 'scratch' ? '#000000' : '#666666',
                                                    border: 'none',
                                                    borderRadius: '8px',
                                                    fontWeight: creationMode === 'scratch' ? 'bold' : 'normal',
                                                    fontSize: '1.1rem',
                                                    cursor: 'pointer'
                                                }}
                                            >
                                                🎨 Desde Cero
                                            </button>

                                        {/* Botón para cargar patrón guardado */}
                                        <div style={{marginTop: '15px', textAlign: 'center'}}>
                                            <button

                                                style={{

                                                    borderRadius: '8px',
                                                    cursor: 'pointer',
                                                    fontSize: '0.95rem',
                                                    width: '100%'

                                                                    const g = pixels[i + 1];
                                                                    const b = pixels[i + 2];
                                                                    
                                                                    if (r === fromR && g === fromG && b === fromB) {
                                                                        pixels[i] = toR;
                                                                        pixels[i + 1] = toG;
                                                                        pixels[i + 2] = toB;
                                                                        replacedCount++;
                                                                    }
                                                                }
                                                                
                                                                ctx.putImageData(imageData, 0, 0);
                                                                setEditedPattern(canvas.toDataURL());
                                                                
                                                                const beadsReplaced = Math.floor(replacedCount / (canvas.width * canvas.height / (result.pattern.width * result.pattern.height)));
                                                                
                                                                setUsedColorsVersion(v => v + 1);
                                                                setDoubleClickModal(null);
                                                                setModalSelectedColor(null);
                                                                
                                                                alert(`✅ Color reemplazado (≈${beadsReplaced} beads afectados)`);
                                                            }}
                                                        >
                                                            🔄 Todos Con Este Color
                                                        </button>
                                                    </div>
                                                    <button
                                                        className="btn btn-secondary"
                                                        style={{width: '100%', padding: '12px'}}
                                                        onClick={() => {
                                                            setDoubleClickModal(null);
                                                            setModalSelectedColor(null);
                                                        }}
                                                    >
                                                        ❌ Cancelar
                                                    </button>        
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>
                </div>                                
            );
        }
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
